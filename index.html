<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRX Pro - TradingView Style</title>
    
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <style>
        body { font-family: 'Inter', 'Segoe UI', sans-serif; background-color: #0c1017; display: flex; justify-content: center; padding: 10px; color: #d1d4dc; margin: 0; }
        .container { background: #131722; padding: 20px; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); width: 100%; max-width: 1200px; border: 1px solid #363c4e; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #363c4e; padding-bottom: 10px; }
        .title { color: #d1d4dc; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .live-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } }

        .timer-box { background: #1e222d; padding: 5px 15px; border-radius: 4px; border: 1px solid #363c4e; color: #f1c40f; font-family: monospace; font-size: 16px; }

        /* Chart Section */
        #chart-wrapper { background: #131722; border-radius: 4px; position: relative; min-height: 450px; }
        
        /* Modern Table Styling */
        .data-table { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 13px; }
        .data-table th { text-align: left; padding: 10px; color: #787b86; border-bottom: 1px solid #363c4e; text-transform: uppercase; }
        .data-table td { padding: 8px 10px; border-bottom: 1px solid #1e222d; }
        
        .win { color: #26a69a; font-weight: bold; }
        .loss { color: #ef5350; font-weight: bold; }
        .type-b { color: #ff9800; }
        .type-s { color: #2196f3; }

        /* Apex Customizations */
        .apexcharts-canvas { margin: 0 auto; }
        .apexcharts-tooltip { background: #1e222d !important; border: 1px solid #363c4e !important; color: #d1d4dc !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title"><div class="live-dot"></div> TRX/USD MODERN CHART</div>
        <div id="bigSmallAlert" style="font-weight: bold; font-size: 20px;"></div>
        <div class="timer-box">NEXT: <span id="countdown">60s</span></div>
    </div>

    <div id="chart-wrapper">
        <div id="main-candle-chart"></div>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>Issue</th>
                <th>Result</th>
                <th>Side</th>
                <th>Prediction</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="table-body">
            </tbody>
    </table>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxtHjuZ50vMa6S3WN3pyW2eF5qXH5tM8Obyry3sQcrQJ6-2e87aN1BR62f-q8lZ1I53/exec"; 
    let timeLeft = 60;
    let chart = null;

    function fetchData() {
        fetch(WEB_APP_URL + "?action=getRawData")
            .then(res => res.json())
            .then(data => {
                updateUI(data);
                renderChart(data);
            });
    }

    function updateUI(data) {
        const tbody = document.getElementById('table-body');
        const alertBox = document.getElementById('bigSmallAlert');
        const latest = data[0];
        
        // Alert Logic
        if(latest.prediction) {
            alertBox.innerText = latest.prediction.includes('B') ? "SIGNAL: BIG" : "SIGNAL: SMALL";
            alertBox.style.color = latest.prediction.includes('B') ? "#ff9800" : "#2196f3";
        }

        tbody.innerHTML = data.slice(0, 10).map(item => `
            <tr>
                <td>${item.label}</td>
                <td><span style="background: ${getBg(item.digit)}; color:white; padding: 2px 8px; border-radius: 10px;">${item.digit}</span></td>
                <td class="${item.type === 'B' ? 'type-b' : 'type-s'}">${item.type}</td>
                <td>${item.prediction}</td>
                <td class="${item.result === 'WIN' ? 'win' : 'loss'}">${item.result || 'PENDING'}</td>
            </tr>
        `).join('');
    }

    function getBg(d) {
        if ([0, 5].includes(parseInt(d))) return "#a855f7";
        if ([1, 3, 7, 9].includes(parseInt(d))) return "#22c55e";
        return "#ef4444";
    }

    function renderChart(rawData) {
        let currentPrice = 500;
        const candleData = rawData.map((item, index) => {
            const digit = parseInt(item.digit) || 0;
            const type = (item.type || "B").toUpperCase();
            let open = currentPrice;
            currentPrice = (type === 'B') ? Math.min(open + (digit * 8), 950) : Math.max(open - (digit * 8), 50);
            let close = currentPrice;
            return {
                x: new Date().getTime() - (rawData.length - index) * 60000,
                y: [open, Math.max(open, close) + 2, Math.min(open, close) - 2, close]
            };
        });

        if (chart) {
            // TradingView Style Update: Series ကိုပဲ update လုပ်ပြီး zoom ကိုထိန်းထားတယ်
            chart.updateSeries([{ data: candleData }], false);
        } else {
            const options = {
                series: [{ data: candleData }],
                chart: {
                    type: 'candlestick',
                    height: 450,
                    background: '#131722',
                    foreColor: '#787b86',
                    fontFamily: 'Inter, sans-serif',
                    animations: { enabled: false },
                    toolbar: { show: true, tools: { pan: true, zoom: true, zoomin: true, zoomout: true, reset: true } }
                },
                plotOptions: {
                    candlestick: {
                        colors: { upward: '#26a69a', downward: '#ef5350' },
                        wick: { useFillColor: true }
                    }
                },
                grid: {
                    borderColor: '#1e222d',
                    xaxis: { lines: { show: true } },
                    yaxis: { lines: { show: true } }
                },
                stroke: { width: 1 },
                xaxis: { 
                    type: 'datetime',
                    axisBorder: { show: false },
                    axisTicks: { show: false }
                },
                yaxis: {
                    min: 0, max: 1000,
                    opposite: true, // TradingView ပုံစံ ညာဘက်မှာ စျေးနှုန်းပြမယ်
                    labels: { formatter: (val) => val.toFixed(0) }
                },
                tooltip: {
                    enabled: true,
                    theme: 'dark',
                    custom: function({seriesIndex, dataPointIndex, w}) {
                        const o = w.globals.seriesCandleO[seriesIndex][dataPointIndex];
                        const h = w.globals.seriesCandleH[seriesIndex][dataPointIndex];
                        const l = w.globals.seriesCandleL[seriesIndex][dataPointIndex];
                        const c = w.globals.seriesCandleC[seriesIndex][dataPointIndex];
                        return `<div style="padding:10px; background:#1e222d;">
                            <div>O: ${o}</div><div>H: ${h}</div><div>L: ${l}</div><div>C: ${c}</div>
                        </div>`;
                    }
                }
            };
            chart = new ApexCharts(document.querySelector("#main-candle-chart"), options);
            chart.render();
        }
    }

    function startTimer() {
        setInterval(() => {
            timeLeft--;
            document.getElementById('countdown').innerText = timeLeft + "s";
            if (timeLeft <= 0) { timeLeft = 60; fetchData(); }
        }, 1000);
    }

    window.onload = () => { fetchData(); startTimer(); };
</script>
</body>
</html>
