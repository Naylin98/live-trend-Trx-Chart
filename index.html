<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRX Live - Modern UI</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0f172a; display: flex; justify-content: center; padding: 10px; color: #f8fafc; overflow-x: hidden; margin: 0; }
        .container { background: #1e293b; padding: 20px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); position: relative; width: 100%; max-width: 1150px; border: 1px solid #334155; }
        .header { position: relative; text-align: center; color: #f1c40f; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; font-size: 20px; font-weight: bold; }
        .timer-box { position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: rgba(15, 23, 42, 0.5); padding: 4px 12px; border-radius: 8px; border: 1px solid #f1c40f; display: flex; flex-direction: column; align-items: center; min-width: 50px; }
        #countdown { font-size: 16px; font-weight: bold; color: #f1c40f; font-family: monospace; }
        
        .pred-alert-box { position: absolute; right: 85px; top: 50%; transform: translateY(-50%); font-size: 22px; font-weight: 900; padding: 6px 14px; border-radius: 8px; display: none; z-index: 1000; }
        .alert-big { display: block; color: #22c55e; border: 3px solid #22c55e; background: rgba(34, 197, 94, 0.1); animation: big-flash 1.7s infinite; }
        .alert-small { display: block; color: #ef4444; border: 3px solid #ef4444; background: rgba(239, 68, 68, 0.1); animation: small-flash 1.7s infinite; }
        @keyframes big-flash { 0%, 100% { box-shadow: 0 0 5px #22c55e; opacity: 1; } 50% { box-shadow: 0 0 20px #22c55e; opacity: 0.6; } }
        @keyframes small-flash { 0%, 100% { box-shadow: 0 0 5px #ef4444; opacity: 1; } 50% { box-shadow: 0 0 20px #ef4444; opacity: 0.6; } }

        .dashboard-labels { display: flex; align-items: center; background: #1e293b; padding: 12px 0; border-bottom: 2px solid #334155; font-size: 13px; font-weight: bold; color: #f1c40f; position: sticky; top: 0; z-index: 100; }
        .row-grid { display: flex; align-items: center; height: 45px; border-bottom: 1px solid #334155; position: relative; z-index: 5; }
        .cells { display: flex; width: 350px; justify-content: center; gap: 4px; border-left: 1px solid #334155; }
        .cell { width: 26px; height: 26px; line-height: 26px; text-align: center; font-weight: bold; border-radius: 50%; background: rgba(255,255,255,0.05); font-size: 14px; color: #475569; }
        .active-green { background-color: #22c55e !important; color: white !important; }
        .active-red { background-color: #ef4444 !important; color: white !important; }
        .active-purple { background-color: #a855f7 !important; color: white !important; }

        .win-text { color: #22c55e; font-weight: bold; width: 70px; text-align: center; }
        .loss-text { color: #ef4444; font-weight: bold; width: 70px; text-align: center; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
        
        #candleContainer { margin-top: 20px; background: rgba(15, 23, 42, 0.5); border-radius: 12px; padding: 10px; border: 1px solid #334155; }
        #apexCandleChart { width: 100%; height: 350px; }
        .footer-info { display: flex; justify-content: space-between; font-size: 11px; color: #64748b; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container" id="chartBox">
    <div class="header">
        TRX MW MODERN TREND (LIVE)
        <div id="bigSmallAlert" class="pred-alert-box"></div>
        <div class="timer-box">
            <span style="font-size:8px; color:#94a3b8;">Next</span>
            <div id="countdown">60s</div>
        </div>
    </div>
    
    <div class="dashboard-labels">
        <div style="width:130px; text-align:center;">TRX ISSUE</div>
        <div style="width:350px; text-align:center;">TREND LINE</div>
        <div style="flex-grow:1; display:flex; padding-left:15px; gap:5px;">
            <span style="width:35px;">B/S</span>
            <span style="width:150px;">MW STRATEGY</span>
            <span style="width:45px;">PRED</span>
            <span style="width:70px;">RESULT</span>
            <span style="flex-grow:1; text-align:right; padding-right:15px;">WIN RATE</span>
        </div>
    </div>

    <canvas id="lineCanvas"></canvas>
    <div id="chartData"><div style="text-align:center; padding:40px;">Loading...</div></div>

    <div id="candleContainer">
        <div style="color:#f1c40f; font-size:13px; font-weight:bold; margin-bottom:10px;">TRX MW FX-STYLE TREND (B S)</div>
        <div id="apexCandleChart"></div>
    </div>
    
    <div class="footer-info">
        <div id="connection-status">Initializing...</div>
        <div id="last-update">Last Update: --:--:--</div>
    </div>
</div>

<script>
    // --- ဒီနေရာမှာ သင့်ရဲ့ Web App URL ကို ထည့်ပါ ---
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxtHjuZ50vMa6S3WN3pyW2eF5qXH5tM8Obyry3sQcrQJ6-2e87aN1BR62f-q8lZ1I53/exec"; 
    let timeLeft = 60;
    let candleChart = null;

    function loadTrendData() {
        const conn = document.getElementById('connection-status');
        fetch(WEB_APP_URL + "?action=getRawData") 
            .then(res => res.json())
            .then(rawData => {
                if (rawData && rawData.length > 0) {
                    const displayData = rawData.slice().reverse();
                    renderModernTable(displayData); 
                    renderApexCandleChart(rawData); 

                    // Alert Box Logic
                    const alertBox = document.getElementById('bigSmallAlert');
                    const latestPred = displayData[0].prediction ? displayData[0].prediction.toString().toUpperCase() : "";
                    alertBox.className = "pred-alert-box";
                    if (latestPred.endsWith('B')) { alertBox.innerText = "BIG"; alertBox.classList.add('alert-big'); }
                    else if (latestPred.endsWith('S')) { alertBox.innerText = "SMALL"; alertBox.classList.add('alert-small'); }
                    else { alertBox.style.display = "none"; }

                    document.getElementById('last-update').innerText = "Last Update: " + new Date().toLocaleTimeString();
                    conn.innerText = "Connected (Live)"; conn.style.color = "#22c55e";
                }
            })
            .catch(err => { conn.innerText = "Connection Error"; conn.style.color = "#ef4444"; });
    }

    function renderModernTable(displayData) {
        const output = document.getElementById('chartData');
        const container = document.getElementById('chartBox');
        const canvas = document.getElementById('lineCanvas');
        const ctx = canvas.getContext('2d');
        output.innerHTML = ""; 

        displayData.forEach((item, rIdx) => {
            const digit = parseInt(item.digit);
            let resClass = item.result === "WIN" ? "win-text" : (item.result === "LOSS" ? "loss-text" : "");
            let winRateStr = item.strend || "0%";

            let digitsHtml = "";
            for (let i = 0; i <= 9; i++) {
                let highlight = (i === digit) ? ([0,5].includes(i) ? "active-purple" : ([1,3,7,9].includes(i) ? "active-green" : "active-red")) : "";
                digitsHtml += `<div class="cell ${highlight}" id="dot-${rIdx}-${i}">${i}</div>`;
            }

            output.innerHTML += `
                <div class="row-grid">
                    <div style="width:130px; text-align:center; font-family:monospace;">${item.label}</div>
                    <div class="cells">${digitsHtml}</div>
                    <div style="flex-grow:1; display:flex; padding-left:15px; gap:5px; align-items:center;">
                        <div style="width:35px; font-weight:bold; color:${item.type==='B'?'#e67e22':'#3498db'}">${item.type||""}</div>
                        <div style="width:150px; font-size:12px; font-style:italic; color:#cbd5e1;">${item.extraData||""}</div>
                        <div style="width:45px; color:#f1c40f; font-weight:bold; text-align:center;">${item.prediction||""}</div>
                        <div class="${resClass}">${item.result||"---"}</div>
                        <div style="flex-grow:1; text-align:right; padding-right:15px; color:#38bdf8; font-weight:bold;">${winRateStr}</div>
                    </div>
                </div>`;
        });

        setTimeout(() => {
            canvas.width = container.offsetWidth; canvas.height = container.offsetHeight;
            ctx.clearRect(0,0, canvas.width, canvas.height);
            ctx.strokeStyle = "#ff4444"; ctx.lineWidth = 1.5; ctx.setLineDash([3,2]);
            ctx.beginPath();
            let hasPoint = false;
            displayData.forEach((item, i) => {
                const el = document.getElementById(`dot-${i}-${parseInt(item.digit)}`);
                if (el) {
                    const r = el.getBoundingClientRect(), cr = container.getBoundingClientRect();
                    const x = r.left - cr.left + (r.width/2), y = r.top - cr.top + (r.height/2);
                    if (!hasPoint) { ctx.moveTo(x,y); hasPoint=true; } else ctx.lineTo(x,y);
                }
            });
            ctx.stroke();
        }, 500);
    }

    function renderApexCandleChart(rawData) {
        let currentPrice = 1.0005;
        const candleData = rawData.map((item) => {
            const type = (item.type || "").toUpperCase();
            let openPrice = currentPrice;
            if (type === 'B') currentPrice = Math.min(currentPrice + 0.0001, -10.0010);
            else if (type === 'S') currentPrice = Math.max(currentPrice - 0.0001, 10.0000);
            let closePrice = currentPrice;
            let date = new Date().getTime() - (rawData.length - rawData.indexOf(item)) * 60000; 
            return { x: date, y: [openPrice.toFixed(5), (Math.max(openPrice,closePrice)+0.00002).toFixed(5), (Math.min(openPrice,closePrice)-0.00002).toFixed(5), closePrice.toFixed(5)] };
        });

        if (candleChart) {
            candleChart.updateOptions({ series: [{ data: candleData }], chart: { animations: { enabled: false } } }, false, false, true); 
        } else {
            const options = {
                series: [{ name: 'TRX Trend', data: candleData }],
                chart: { type: 'candlestick', height: 350, id: 'trx-candles', background: 'transparent',
                    toolbar: { show: true, autoSelected: 'zoom', tools: { download: false, selection: true, zoom: true, zoomin: true, zoomout: true, pan: true, reset: true } },
                    zoom: { enabled: true, type: 'x', autoScaleYaxis: true }
                },
                plotOptions: { candlestick: { colors: { upward: '#22c55e', downward: '#ef4444' }, wick: { useFillColor: true }, candle: { width: { max: 7 } } } },
                xaxis: { type: 'datetime', labels: { style: { colors: '#94a3b8' } } },
                yaxis: { min: 1.0000, max: 1.0010, labels: { style: { colors: '#f1c40f' }, formatter: (val) => val.toFixed(5) } },
                grid: { borderColor: 'rgba(148, 163, 184, 0.1)' },
                tooltip: { enabled: false }
            };
            candleChart = new ApexCharts(document.getElementById('apexCandleChart'), options);
            candleChart.render();
        }
    }

    function startTimer() {
        setInterval(() => {
            timeLeft--;
            document.getElementById('countdown').textContent = (timeLeft < 10 ? "0" + timeLeft : timeLeft) + "s";
            if (timeLeft <= 0) { timeLeft = 60; loadTrendData(); }
        }, 1000);
    }

    window.onload = () => { loadTrendData(); startTimer(); };
</script>
</body>
</html>
